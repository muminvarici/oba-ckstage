# This file aggregates all infrastructure component definitions
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: infrastructure-api-gateway
  description: API Gateway for microservices routing
spec:
  type: file
  targets:
    - ./api-gateway.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
