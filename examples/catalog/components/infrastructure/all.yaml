  targets:
    - ./message-queue.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: infrastructure-database-cluster
  description: PostgreSQL database cluster
spec:
  type: file
  targets:
    - ./database-cluster.yaml
