apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: user-api
  description: RESTful API for user operations (CRUD, authentication, profile management)
  tags:
    - rest
    - openapi
    - users
spec:
  type: openapi
  lifecycle: production
  owner: backend-team
  system: examples
  definition: |
    openapi: 3.0.0
    info:
      title: User API
      description: User management and authentication API
      version: 1.0.0
    servers:
      - url: https://api.example.com/v1
        description: Production server
    paths:
      /users:
        get:
          summary: List all users
          operationId: listUsers
          tags:
            - users
          responses:
            '200':
              description: Successful response
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        post:
          summary: Create a new user
          operationId: createUser
          tags:
            - users
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CreateUserRequest'
          responses:
            '201':
              description: User created
      /users/{userId}:
        get:
          summary: Get user by ID
          operationId: getUser
          tags:
            - users
          parameters:
            - name: userId
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Successful response
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/User'
    components:
      schemas:
        User:
          type: object
          properties:
            id:
              type: string
            username:
              type: string
            email:
              type: string
            createdAt:
              type: string
              format: date-time
        CreateUserRequest:
          type: object
          required:
            - username
            - email
          properties:
            username:
              type: string
            email:
              type: string
            password:
              type: string
