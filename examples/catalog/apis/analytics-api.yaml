apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: analytics-api
  description: GraphQL API for analytics data and reporting
  tags:
    - graphql
    - analytics
    - reporting
spec:
  type: graphql
  lifecycle: experimental
  owner: data-team
  system: examples
  definition: |
    type Query {
      """
      Get analytics data for a specific date range
      """
      analytics(dateFrom: String!, dateTo: String!): AnalyticsResult!
      
      """
      Get user statistics
      """
      userStats: UserStats!
      
      """
      Get order statistics
      """
      orderStats: OrderStats!
      
      """
      Get revenue statistics
      """
      revenueStats: RevenueStats!
    }

    type AnalyticsResult {
      totalUsers: Int!
      totalOrders: Int!
      revenue: Float!
      averageOrderValue: Float!
      conversionRate: Float!
    }

    type UserStats {
      activeUsers: Int!
      newUsers: Int!
      churnRate: Float!
    }

    type OrderStats {
      totalOrders: Int!
      completedOrders: Int!
      cancelledOrders: Int!
      averageProcessingTime: Float!
    }

    type RevenueStats {
      totalRevenue: Float!
      currency: String!
      growthRate: Float!
      revenueByCategory: [CategoryRevenue!]!
    }

    type CategoryRevenue {
      category: String!
      revenue: Float!
    }
