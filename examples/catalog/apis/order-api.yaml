apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: order-api
  description: RESTful API for order management and processing
  tags:
    - rest
    - openapi
    - orders
spec:
  type: openapi
  lifecycle: production
  owner: backend-team
  system: examples
  definition: |
    openapi: 3.0.0
    info:
      title: Order API
      description: Order management and processing API
      version: 1.0.0
    servers:
      - url: https://api.example.com/v1
        description: Production server
    paths:
      /orders:
        get:
          summary: List all orders
          operationId: listOrders
          tags:
            - orders
          responses:
            '200':
              description: Successful response
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        post:
          summary: Create a new order
          operationId: createOrder
          tags:
            - orders
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CreateOrderRequest'
          responses:
            '201':
              description: Order created
      /orders/{orderId}:
        get:
          summary: Get order by ID
          operationId: getOrder
          tags:
            - orders
          parameters:
            - name: orderId
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Successful response
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Order'
    components:
      schemas:
        Order:
          type: object
          properties:
            id:
              type: string
            userId:
              type: string
            status:
              type: string
              enum: [pending, processing, completed, cancelled]
            totalAmount:
              type: number
            createdAt:
              type: string
              format: date-time
        CreateOrderRequest:
          type: object
          required:
            - userId
            - items
          properties:
            userId:
              type: string
            items:
              type: array
              items:
                type: object
